name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chequeo:
    name: Tipos, lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
